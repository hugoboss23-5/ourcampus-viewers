<title id="title">Proposed six-hall land allocation</title>
<desc id="desc">Proposed three pairs of hillside halls and service land, 11.53 acres in total, shown over the current modeled campus. Existing halls, parking, soccer and outdoor venue footprints are retained. Northern landscaping and activity areas would be affected. Location needs Hugo's decision. This is a work-in-progress allocation diagram, not a surveyed parcel or finished model.</desc>
