<text x="792.000" y="244.000" class="hud amber" text-anchor="start">PROPOSED LAND RESERVATION</text>
<text x="792.000" y="292.000" class="strong amber" text-anchor="start">11.53 acres</text>
<text x="792.000" y="323.000" class="note" text-anchor="start">Includes the service allocation</text>
<text x="792.000" y="348.000" class="small amber" text-anchor="start">Location needs Hugo’s decision</text>
<text x="778.000" y="411.000" class="strong" text-anchor="start">What this reserves</text>
<text x="778.000" y="443.000" class="note muted" text-anchor="start">Six halls, each 25,000 gross sq ft.</text>
<text x="778.000" y="469.000" class="note muted" text-anchor="start">Three pairs, hills and circulation.</text>
<text x="778.000" y="495.000" class="note muted" text-anchor="start">Space along the east for service access.</text>
<text x="778.000" y="551.000" class="strong" text-anchor="start">What stays in place</text>
<text x="778.000" y="583.000" class="note muted" text-anchor="start">Both main halls and surface parking.</text>
<text x="778.000" y="609.000" class="note muted" text-anchor="start">Both current soccer fields.</text>
<text x="778.000" y="635.000" class="note muted" text-anchor="start">The outdoor venue footprint.</text>
<text x="778.000" y="691.000" class="strong" text-anchor="start">Existing uses are affected</text>
<text x="778.000" y="723.000" class="note muted" text-anchor="start">The reserved land already contains</text>
<text x="778.000" y="749.000" class="note muted" text-anchor="start">landscaping and activity areas.</text>
<text x="778.000" y="785.000" class="note muted" text-anchor="start">Their replacement or relocation needs</text>
<text x="778.000" y="811.000" class="note muted" text-anchor="start">a separate decision. It is not empty land.</text>
