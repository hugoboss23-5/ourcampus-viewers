oad-card h2{font-size:22px;letter-spacing:-.03em;font-weight:550;margin:0 0 12px}.load-card p{font-size:13px;line-height:1.7;color:var(--muted)}progress{width:180px;height:3px;accent-color:var(--cyan);margin:18px}@media(max-width:520px){.hint{font-size:9px;bottom:17px}.dock{right:10px;bottom:10px}button{padding:9px 10px}}
</style><script type="importmap">{"imports":{"three":"../../../vendor/three.module.js","three/addons/":"../../../vendor/addons/"}}</script></head><body>
<main id="viewport" aria-label="Interactive three-dimensional hillside data halls"></main>
<header class="glass"><h1>Hillside shells</h1><p id="caption">Two halls · concept design</p></header>
<p class="hint" id="hint">Drag to explore · Scroll to move closer</p>
<nav class="dock" id="dock" aria-label="Explore the hillside"><fieldset id="controls" disabled><button data-view="interior" id="enter-hall" aria-pressed="false" disabled>Go inside</button><button id="views-toggle" aria-expanded="false" aria-controls="view-menu">Views ▴</button></fieldset><div id="view-menu" class="glass" hidden><button data-view="arrival" aria-pressed="true">Front arrival</button><button data-view="rear" aria-pressed="false">Rear garden</button><button data-view="aerial" aria-pressed="false">From above</button><button data-view="section" aria-pressed="false">Roof cutaway</button><button data-walk="other" id="other-hall" hidden>Visit the other hall</button><button id="capture">Save image</button></div></nav>
