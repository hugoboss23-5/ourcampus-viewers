<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>David’s campus · Work in progress</title><link rel="icon" href="data:,">
<style>
:root{color:#eaf5f8;background:#05070d;font-family:"Avenir Next",Avenir,system-ui,sans-serif;--cyan:#2fd8ff;--line:#12202e;--muted:#a1b9c6}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}button,a{text-decoration:none}header{min-height:66px;display:flex;align-items:center;gap:22px;padding:12px 22px;border-bottom:1px solid var(--line);background:#0b111a}h1{font-size:17px;letter-spacing:-.035em;white-space:nowrap;margin:0}header small{display:block;font:9px/1.6 monospace;color:#ff8a2b;text-transform:uppercase;letter-spacing:.12em}nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}button{background:transparent;border:1px solid transparent;border-radius:6px;padding:9px 12px;color:var(--muted);font-size:12px}button:hover{color:white;background:#2fd8ff0b}button[aria-pressed=true]{color:#7fe9ff;border-color:#2fd8ff42;background:#2fd8ff12;box-shadow:0 0 18px #2fd8ff0b}button:disabled{cursor:default;opacity:.4}#reload{font-size:11px;padding:7px;color:var(--muted)}.intro{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 22px}.intro h2{font-size:17px;margin:0 0 3px;letter-spacing:-.025em}.intro p{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}#open{color:#7fe9ff;font-size:12px;white-space:nowrap;border:1px solid #1b3542;border-radius:5px;padding:8px 12px}.stage{height:calc(100dvh - 191px);min-height:400px;background:#0a1017;position:relative;border-block:1px solid var(--line);overflow:hidden}.stage img{display:block;width:100%;height:100%;object-fit:contain}.stage iframe{display:block;width:100%;height:100%;border:0;background:#05070d}#tools{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;min-height:48px}footer{padding:0 20px 12px;font-size:10px;color:#819ba9;text-align:center}.note{max-width:950px;margin:auto;padding:42px 30px;line-height:1.6}.note h3{font-size:23px;letter-spacing:-.035em;margin:0 0 12px}.note p{font-size:14px;color:var(--muted)}.note ul{padding-left:20px;color:#c9d9e2;font-size:14px}.note li{margin:15px 0}.note strong{color:#eaf5f8}.stage:has(.note){overflow:auto}.badge{font:10px monospace;letter-spacing:.09em;text-transform:uppercase;color:#7fe9ff}.load-error{color:#ffc062!important}[hidden]{display:none!important}@media(max-width:850px){header{flex-wrap:wrap;gap:8px;padding:10px 14px}h1{flex:1}nav{order:3;flex-basis:100%}nav button{padding:8px;font-size:11px}.intro{padding:10px 14px}.stage{height:calc(100dvh - 245px);min-height:300px}.intro h2{font-size:15px}.intro p{font-size:11px}#open{font-size:10px;padding:7px}.note{padding:22px}}
</style>
</head>
<body>
<header><h1>David’s campus<small>Work in progress · 04 October 2026</small></h1><nav aria-label="Review pending work"><button data-tab="hills" aria-pressed="true">Data-center hills</button><button data-tab="hall" aria-pressed="false">Performance hall</button><button data-tab="materials" aria-pressed="false">Materials &amp; accuracy</button><button data-tab="site" aria-pressed="false">Site placement</button><button data-tab="speed" aria-pressed="false">Speed test</button><button data-tab="remaining" aria-pressed="false">Still to build</button></nav><button id="reload">Refresh work</button></header>
<section class="intro"><div><h2 id="title">Loading the saved work</h2><p id="subtitle">Fetching the current review package.</p></div><a id="open" target="_blank" rel="noopener" hidden>Open full size ↗</a></section>
<main id="stage" class="stage" aria-live="polite"></main><div id="tools" aria-label="Review views"></div><footer id="footer">Separate review only. These changes have not been integrated into the main campus.</footer>
<script>
let data,tab='hills',hillView='model';
const $=s=>document.querySelector(s),stage=$('#stage'),tools=$('#tools');
function image(src,alt){const el=document.createElement('img');el.src=src;el.alt=alt;el.onerror=()=>{el.remove();note('Image unavailable','This saved view could not be loaded. Use Refresh work to retry.');};stage.append(el);$('#open').href=src;$('#open').hidden=false;}
function frame(src,title){const el=document.createElement('iframe');el.src=src;el.title=title;el.allow='fullscreen';stage.append(el);$('#open').href=src;$('#open').hidden=false;}
function note(title,body,items=[]){const el=document.createElement('div');el.className='note';const h=document.createElement('h3');h.textContent=title;el.append(h);const p=document.createElement('p');p.textContent=body;el.append(p);if(items.length){const ul=document.createElement('ul');for(const item of items){const li=document.createElement('li');li.textContent=item;ul.append(li);}el.append(ul);}stage.append(el);}
function control(label,value,action){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(hillView===value));b.onclick=action;tools.append(b);}
function render(){if(!data)return;stage.replaceChildren();tools.replaceChildren();$('#open').hidden=true;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));const item=data[tab];$('#title').textContent=item.title;$('#subtitle').textContent=item.subtitle;$('#footer').textContent=item.footer||'Separate review only. These changes have not been integrated into the main campus.';
if(tab==='hills'){if(hillView==='model'&&item.model){frame(item.model,'Interactive hillside design work in progress');}else{if(hillView==='model')hillView='model';image(item.views[hillView],item.title+' · '+hillView+' · rendered from saved model');}for(const [v,label] of [['rear','Saved rear image'],['aerial','Saved aerial image'],['interior','Saved interior image']])control(label,v,()=>{hillView=v;render();});if(item.model)control('Explore in 3D','model',()=>{hillView='model';render();});else{const t=document.createElement('span');t.className='badge';t.textContent='Interactive export in progress';tools.append(t);}}
else if(tab==='hall')frame(item.url,'Interactive Garden Performance Hall design study');
else if(tab==='materials')frame(item.url,'Materials and accuracy of the hillside design');
else if(tab==='site'){if(item.url)image(item.url,'Proposed six-hall land allocation with existing campus uses');else note('Site placement being prepared',item.description);}
else if(tab==='speed'){if(item.url)frame(item.url,'Private full-detail campus speed experiment');else note('Speed experiment being prepared',item.description);}
else note('Prepared work is not installed work',item.description,item.items);
}
async function refresh(){const b=$('#reload');b.disabled=true;b.textContent='Refreshing…';try{const r=await fetch('./review-data.json',{cache:'no-store'});if(!r.ok)throw new Error('Review package HTTP '+r.status);data=await r.json();render();}catch(e){$('#subtitle').textContent=e.message;$('#subtitle').classList.add('load-error');}finally{b.disabled=false;b.textContent='Refresh work';}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;history.replaceState(null,'','#'+tab);render();});$('#reload').onclick=refresh;if(['hills','hall','materials','site','speed','remaining'].includes(location.hash.slice(1)))tab=location.hash.slice(1);refresh();
</script>
</body></html>
