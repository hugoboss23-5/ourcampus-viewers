name: Publish OurCampus viewers
on:
  push:
    branches: [main]
    paths: ["site/**", "release.sha256"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Recreate and verify the original 3D model
        run: |
          base=site/worldwide-stages-david/assets/visible-revisions/option-05/eb8d179eed0591119cc0b364218ff69b2ab127750c34863b85e143f632ea8a85/option-05.glb
          gzip -d "$base.gz"
          sha256sum -c release.sha256
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
